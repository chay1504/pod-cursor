name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-and-mac-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test motion logic and protocol
        run: |
          python3 -m unittest discover -s tests -p 'test_engine.py' -v
          python3 -m unittest discover -s tests -p 'test_protocol.py' -v
      - name: Check Mac setup scripts
        run: |
          bash -n Setup-Mac.command
          bash -n Start-Mac.command
          plutil -lint native/Info.plist
      - name: Compile Mac motion helper
        run: >-
          xcrun swiftc native/MotionBridge.swift -O
          -target "$(uname -m)-apple-macosx14.0"
          -framework Foundation -framework CoreMotion
          -o "$RUNNER_TEMP/CaseMotion"

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test all logic and UI safety
        run: python -m unittest discover -s tests -v
